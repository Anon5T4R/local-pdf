[package]
name = "localpdf-ai"
description = "BYOK AI for LocalPDF: OpenAI-compatible providers, OS-keychain keys, models list, chat and vision"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/Anon5T4R/local-pdf"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
keyring = { version = "4", default-features = false, features = ["v1"] }
dirs = "7"

[lints]
workspace = true
