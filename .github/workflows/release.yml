name: Release

# Tag vX.Y.Z -> builda Windows (MSI + portable), Linux (AppImage, deb, rpm, tar.gz, cli)
# e valida o PKGBUILD do Arch; publica tudo na GitHub Release da tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fontes japonesas vendored
        run: 'echo "CRAFT_FONTS_DIR=$env:GITHUB_WORKSPACE\assets\craft-fonts" >> $env:GITHUB_ENV'
      - name: WiX Toolset
        run: dotnet tool install --global wix
      - name: Aceite da EULA WiX (OSMF; fee só para orgs com receita >= US$10k/ano)
        run: wix eula accept wix7
      - name: Build e pacote
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/release/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fontes japonesas vendored
        run: echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/assets/craft-fonts" >> "$GITHUB_ENV"
      - name: Dependências de empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev ninja-build
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build e pacote
        run: packaging/linux/package.sh --formats "appimage deb rpm tar cli"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/release/*

  arch:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist/release
      - name: Pacote Arch (makepkg a partir do tarball da release)
        run: |
          set -euo pipefail
          # makepkg recusa root: usuário sem privilégio constrói; fakeroot
          # normaliza a posse dos arquivos do pacote.
          pacman -Sy --noconfirm fakeroot >/dev/null
          useradd -m builder
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          work=$(mktemp -d)
          cp packaging/arch/PKGBUILD "$work/"
          cp "dist/release/localpdf-$version-linux-x86_64.tar.gz" "$work/localpdf-$version-linux-x86_64.tar.gz"
          # Fonte local (a URL da release ainda não existe neste ponto do
          # pipeline) + checksum REAL do artefato em vez de SKIP.
          sha=$(sha256sum "$work/localpdf-$version-linux-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i "s|^source=.*|source=(\"localpdf-$pkgver-linux-x86_64.tar.gz\")|; s|^sha256sums=.*|sha256sums=('$sha')|" "$work/PKGBUILD"
          chown -R builder "$work"
          cd "$work"
          su builder -c 'makepkg --noconfirm --noprogressbar'
          mv localpdf-*.pkg.tar.zst "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: '*.pkg.tar.zst'
          if-no-files-found: error
  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publica a release
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/windows/* dist/linux/* dist/arch/* dist/SHA256SUMS.txt \
            --title "Local PDF ${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
