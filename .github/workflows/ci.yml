name: CI

# Qualidade em todo push para main e todo PR: fmt, clippy, build --locked e testes.
# Autossuficiente: não depende de workflows de outra organização.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PDFCRAFT_REQUIRE_WINRES: ${{ runner.os == 'Windows' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependências de build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libgtk-3-dev qpdf poppler-utils mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fontes japonesas vendored
        shell: bash
        run: echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/assets/craft-fonts" >> "$GITHUB_ENV"
      - name: Formatação (nightly; só o nosso código — libs/ e vendor/ mantêm o estilo de origem)
        shell: bash
        run: |
          files=$(git ls-files '*.rs' | grep -v -E '^(libs|vendor)/')
          rustfmt +nightly --edition 2024 --check $files
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build --locked
        run: cargo build --locked
      - name: Testes
        run: cargo test --locked

  arch:
    name: Arch Linux (makepkg)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependências
        run: |
          pacman -Syu --noconfirm rust clang lld
      - name: Build --locked
        run: cargo build --locked
      - name: PKGBUILD válido (makepkg --printsrcinfo)
        run: |
          useradd -m builder
          chown -R builder:builder packaging/arch
          cd packaging/arch
          sudo -u builder makepkg --printsrcinfo > /dev/null
          echo "PKGBUILD parseia e gera .SRCINFO"

  git-sources:
    name: Sem dependências git remotas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cargo.lock não pode ter fontes git+
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          cargo metadata --locked --format-version 1 > /dev/null
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")})
          if bad:
              print("Dependências git encontradas (proibido):", *bad, sep="\n")
              sys.exit(1)
          PY
