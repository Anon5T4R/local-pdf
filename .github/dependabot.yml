version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directories:
      - "/"
      # "/crates/filters/fuzz" fica fora: ele herda `edition` do workspace raiz e o Dependabot
      # não resolve (dependency_file_not_resolvable, falha diária). As deps dele já são
      # fixadas pelo Cargo.lock do repo e checadas pelo CI com --locked.
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
