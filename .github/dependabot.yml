version: 2
updates:
  # Updates de cargo ficam FORA do Dependabot: com as libs vendorizadas em libs/ (excluded do
  # workspace raiz) ele falha a coleta de arquivos (`/libs/craft-libs/crates/a11y/Cargo.toml not
  # found`; antes, o fuzz). Regra da suíte: dependências mudam via `cargo update` manual, sempre
  # com Cargo.lock + entrada no local-deps/DEPENDENCIES.md + linha no CHANGELOG-deps.md.

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
