[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor", "libs"]
default-members = ["crates/*", "apps/localpdf", "apps/localpdf-cli", "xtask"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Anon5T4R/local-pdf"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
craft-ui = { path = "libs/craft-libs/crates/ui/", features = ["serde"] }
# Quit the macOS way (#1136): Ã¢Å’ËœQ asks about unsaved changes, and closing quits through `terminate:`.
craft-quit = { path = "libs/craft-libs/crates/quit/" }
# One menu definition for the native macOS menu bar and the in-window bar elsewhere.
craft-menu = { path = "libs/craft-libs/crates/menu/" }
craft-keymap = { path = "libs/craft-libs/crates/keymap/", default-features = false }
# Shared system spooler; document composition remains in localpdf-print.
craft-print = { path = "libs/craft-libs/crates/print/" }
# Whether a path stored in a document may be opened (GoToR link targets).
craft-docpath = { version = "0.1.0", path = "libs/craft-libs/crates/docpath/" }
craft-update = { path = "libs/craft-libs/crates/update/", features = ["egui"] }
# internal
localpdf-geom = { path = "crates/geom", version = "0.14.0" }
localpdf-filters = { path = "crates/filters", version = "0.14.0" }
localpdf-cos = { path = "crates/cos", version = "0.14.0" }
localpdf-crypt = { path = "crates/crypt", version = "0.14.0" }
localpdf-organize = { path = "crates/organize", version = "0.14.0" }
localpdf-measure = { path = "crates/measure", version = "0.14.0" }
localpdf-annot = { path = "crates/annot", version = "0.14.0" }
localpdf-audit = { path = "crates/audit", version = "0.14.0" }
localpdf-fonts = { path = "crates/fonts", version = "0.14.0" }
localpdf-model = { path = "crates/model", version = "0.14.0" }
localpdf-content = { path = "crates/content", version = "0.14.0" }
localpdf-redact = { path = "crates/redact", version = "0.14.0" }
localpdf-print = { path = "crates/print", version = "0.14.0" }
localpdf-xfdf = { path = "crates/xfdf", version = "0.14.0" }
localpdf-sign = { path = "crates/sign", version = "0.14.0" }
localpdf-optimize = { path = "crates/optimize", version = "0.14.0" }
localpdf-a11y = { path = "crates/a11y", version = "0.14.0" }
localpdf-oracle = { path = "crates/oracle", version = "0.14.0" }
localpdf-testkit = { path = "crates/testkit", version = "0.14.0" }
localpdf-ocr = { path = "crates/ocr", version = "0.14.0" }
localpdf-js = { path = "crates/js", version = "0.14.0" }
localpdf-compare = { path = "crates/compare", version = "0.14.0" }
localpdf-preflight = { path = "crates/preflight", version = "0.14.0" }
localpdf-export = { path = "crates/export", version = "0.14.0" }
localpdf-edit = { path = "crates/edit", version = "0.14.0" }
localpdf-create = { path = "crates/create", version = "0.14.0" }
localpdf-forms = { path = "crates/forms", version = "0.14.0" }
localpdf-xfa = { path = "crates/xfa", version = "0.14.0" }
localpdf-render = { path = "crates/render", version = "0.14.0" }
localpdf-engine = { path = "crates/engine", version = "0.14.0" }
localpdf-platform = { path = "crates/platform", version = "0.14.0" }
localpdf-ui-egui = { path = "crates/ui-egui", version = "0.14.0" }
localpdf-automation = { path = "crates/automation", version = "0.14.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# testing
proptest = "1"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
# Monotonic time for logic-only work on native and web (`App::logic` runs without a UI pass).
web-time = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Dependencies
# carry no debug info and our own crates only line tables: backtraces and
# panics still show file and line, while test binaries and the target dir stay
# small (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.low-disk]
inherits = "dev"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
vello_common = { path = "vendor/vello_common" }
# The egui and winit crates below resolve from the vendored forks under libs/ (path sources;
# 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc).
# Only the retained `vendor/winit` and `vendor/egui-wgpu` copies are provenance for the app's
# earlier patches and their source guards, not path patches; the other `vendor/` entries above
# remain real path patches. See vendor/README.md and the migration plan.
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
