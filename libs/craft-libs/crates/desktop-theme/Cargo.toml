[package]
name = "craft-desktop-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Vendored into each app, never published: the path dependency on craft-platform has no version
# (cargo-deny `wildcards` rejects it on a publishable crate).
publish = false
description = "Makes egui's system theme answer on Linux, where winit reports none, from the XDG Settings portal"

[dependencies]
egui = { workspace = true }
# The portal subscription itself: upstream's watcher, vendored next to this crate in every app.
craft-platform = { path = "../platform", features = ["appearance", "egui"] }

[lints]
workspace = true
